name: Build Windows artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip

      - name: Ensure Inno Setup is installed
        shell: powershell
        run: |
          $Compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $Compiler)) {
            choco install innosetup --yes --no-progress
          }

      - name: Build and self-test v0.4.5.1
        shell: powershell
        run: .\build.ps1

      - name: Upload Windows test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShroudDesigner-0.4.5.1-windows-x86_64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/ShroudDesigner-0.4.5.1-Setup.exe
            dist/ShroudDesigner-0.4.5.1-windows-x86_64.zip
            dist/SHA256SUMS-windows.txt
